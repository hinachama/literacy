<html lang="ja">

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
strong {color:blue;}
  </style>
</head>

  <p>
   styleタグを使うと<strong>全体のスタイルを変更</strong>することができます。これはCSSによるスタイルの指定であり、HTMLの発展形です。
  </p>
</body>

</html>
